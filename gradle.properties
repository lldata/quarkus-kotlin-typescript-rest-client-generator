# Set here, not per module, so the two published artifacts cannot drift apart. Gradle applies these
# to every project.
group=dk.lldata
version=1.0.0-alpha6

org.gradle.caching=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m

# The example only. The generator itself depends on no Quarkus artifact — it reads JAX-RS, Jackson
# and Kotlin metadata, all of which are compileOnly there.
quarkusPluginVersion=3.38.0
quarkusPlatformGroupId=io.quarkus.platform
quarkusPlatformArtifactId=quarkus-bom
quarkusPlatformVersion=3.38.0
