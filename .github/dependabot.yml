# This library follows the latest: a bump that passes the gate merges, and the commit is buildable
# through JitPack immediately, so nothing is released for one. AGENTS.md explains why that is safe
# — the example runs the generator against the platform's own classpath, which is a consumer's
# situation — and names the few bumps that still wait for a human.
#
# Weekly rather than monthly, because a policy of following the latest is not served by a batch of
# four-week-old bumps arriving together. Duplicates between the directories below sort themselves
# out under that policy: Dependabot closes a pull request whose bump another one already landed.
version: 2

updates:

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Gradle is read per directory rather than per project, so every module with its own build
  # script needs naming; the root holds the publishing plugins.
  - package-ecosystem: gradle
    directories:
      - "/"
      - "/generator"
      - "/annotations"
      - "/example/backend"
    schedule:
      interval: weekly
    # `dk.lldata:typescriptpoet` is deliberately in no group, so it arrives alone and its
    # emitted diff can be read: it is the writer that decides how the client is laid out, and a
    # bump can change the output. AGENTS.md never lets an emitted change merge unread.
    groups:
      # Kotlin and Dokka move together; one pull request rather than several.
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.dokka*"
      test:
        patterns:
          - "org.junit*"
          - "io.kotest*"
      # The example's stack, which is not published and moves on its own cadence.
      quarkus:
        patterns:
          - "io.quarkus*"
          - "io.rest-assured*"

  # The example's page and the client it is written against. `tsc` here is the only thing that
  # proves the emitted TypeScript compiles, so its version is part of the gate.
  - package-ecosystem: npm
    directory: "/example/web"
    schedule:
      interval: weekly
