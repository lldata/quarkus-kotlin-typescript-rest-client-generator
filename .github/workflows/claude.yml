name: Claude

# Responds to @claude in an issue or pull request comment. This is the manual door into the
# agent: use it to ask for analysis, to hand it an issue the trusted-author rule did not pick
# up, or to ask a question about the code without opening an issue at all.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

jobs:

  claude:
    if: contains(github.event.comment.body, '@claude')

    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:

    - uses: actions/checkout@v7

    # 21 is the toolchain the build asks for. The jars target 17, but that is a floor the
    # compiler enforces, not the JDK the build runs on.
    - uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'

    # The generated client is type-checked with real tsc, as a separate npm step rather than
    # from Gradle. Without Node that half of the gate cannot run at all.
    - uses: actions/setup-node@v7
      with:
        node-version: '24'

    - uses: gradle/actions/setup-gradle@v6

    - uses: anthropics/claude-code-action@v1
      with:
        claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        claude_args: |
          --max-turns 60
