name: Agent — tend

# The rest of the automation reacts to events. Events get missed: a run dies halfway, a
# reviewer objects and nobody answers, an issue arrives while the credential is broken. This
# is the sweep that notices, and it is what makes the difference between an agent that works
# when watched and one that keeps working when not.
#
# It surveys in shell first and only starts the agent when there is something to do, because a
# quiet repository is the common case and spinning up a model to discover that is waste.

on:
  schedule:
    # Every three hours. The backstop rather than the main path now: it catches what the event
    # triggers below missed — a run that died, a merge that never came, a quiet repository with
    # something stuck in it.
    - cron: "17 */3 * * *"

  # A merge is the moment the previous piece of work actually landed, and so the first moment the
  # next issue can be started from a `main` that contains it. Serial runs alone do not give that:
  # a run ends when its pull request opens, minutes before auto-merge lands it, so every branch in
  # a burst still gets cut from the same stale base and regenerates the committed client, the
  # stamp and the changelog from it.
  #
  # `push` rather than `pull_request: [closed]` because a merge to main is a push to main: it
  # fires once, in the base repository, with the credentials this needs. A `pull_request` event
  # from a fork would arrive with a read-only token and no secrets.
  #
  # A push cannot run the agent directly: `claude-code-action` rejects the event outright with
  # "Unsupported event type: push". So the push only wakes the `dispatch` job below, and the run
  # that does the work arrives as `workflow_dispatch` — the same path the schedule and the manual
  # trigger already take.
  push:
    branches: [ main ]

  # Work arriving should not wait up to three hours for the clock. This is safe to trigger from
  # here in a way `agent-issue.yml` is not — see the concurrency note below.
  issues:
    types: [ opened ]

  workflow_dispatch:

permissions: {}

# Never two of these at once, and never one alongside a run started by an issue: they would
# pick the same work and race each other's branches.
#
# What this group does when a third run arrives is worth stating, because it is not a queue and
# reads like one. It holds one running run and one *pending* run; a third arrival takes the
# pending slot and cancels whatever was in it. `cancel-in-progress: false` governs the running
# slot only, and nothing governs the other one.
#
# That is precisely why automatic dispatch lives here rather than on the issue event. An evicted
# sweep costs nothing: a sweep carries no instructions, it works out what to do by reading the
# repository, so whichever sweep survives finds everything the cancelled ones would have. A run
# pinned to one issue is the opposite — evict it and that issue's only scheduled attempt is gone,
# with nothing anywhere recording that it was owed one.
concurrency:
  group: agent-write
  cancel-in-progress: false

jobs:

  # A merge wakes the sweep, but it has to come back through the front door. The agent step
  # cannot run on a `push` event at all, so this job does the only thing a push is good for
  # here: it asks for a `workflow_dispatch` run and stops.
  #
  # That re-entry works because `workflow_dispatch` is one of the two events GitHub still
  # delivers when the actor is `GITHUB_TOKEN`. Everything else raised by that token is dropped
  # on purpose, to stop workflows triggering themselves in a loop — which is also why the
  # failure notice this workflow files does not wake another sweep.
  dispatch:
    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    permissions:
      actions: write

    steps:

    # `--ref` rather than letting gh work it out: resolving the default branch is a
    # `repository.defaultBranchRef` read, which this token does not have and should not be given
    # for one lookup. The ref is already known — this job only runs on a push to `main`.
    - env:
        GH_TOKEN: ${{ github.token }}
      run: gh workflow run agent-tend.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"

  survey:
    # The push-triggered run exists only to dispatch; the dispatched run does the work.
    if: github.event_name != 'push'

    runs-on: ubuntu-latest

    outputs:
      work: ${{ steps.look.outputs.work }}

    permissions:
      contents: read
      pull-requests: read
      issues: read
      # The survey asks whether an issue run is already in flight before claiming issue work.
      actions: read

    steps:

    - uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - id: look
      env:
        GH_TOKEN: ${{ github.token }}
      run: .github/scripts/survey.sh

  tend:
    needs: [ survey ]
    if: needs.survey.outputs.work == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:

    - uses: actions/checkout@v7

    - uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'

    # Half the gate is `npm run typecheck` in example/web; without Node that check skips and a
    # green Gradle build would prove less than it appears to.
    - uses: actions/setup-node@v7
      with:
        node-version: '24'

    - uses: gradle/actions/setup-gradle@v6

    - id: agent
      uses: anthropics/claude-code-action@v1
      with:
        claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        # Scheduled runs are attributed to whoever last edited the cron line, and the agent's
        # own pull requests are authored by the app, so both need to be allowed through the
        # bot check. `github-actions` is there for the merge wake: the `dispatch` job above asks
        # for this run with GITHUB_TOKEN, so the run it produces is attributed to that bot and is
        # otherwise refused before the agent starts. Named rather than `*`, so the only bots that
        # can start a sweep are the two this repository actually uses.
        allowed_bots: "claude,github-actions"
        prompt: "/tend"
        claude_args: |
          --max-turns 200
          --permission-mode acceptEdits
          --allowedTools "Read,Write,Edit,Grep,Glob,Bash"

    # The log records what the agent did, never what it decided. Keep the transcript so a run
    # that produced nothing can still be explained.
    - name: Keep the agent's transcript
      if: always() && steps.agent.outputs.execution_file != ''
      uses: actions/upload-artifact@v7
      with:
        name: transcript-tend-${{ github.run_id }}
        path: ${{ steps.agent.outputs.execution_file }}
        retention-days: 30
        if-no-files-found: warn

    # Same reasoning as the issue workflow: a sweep that dies silently is indistinguishable
    # from a sweep that found nothing, and those are not the same thing.
    - name: Say that the sweep failed
      if: failure()
      env:
        GH_TOKEN: ${{ github.token }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        existing=$(gh issue list --state open --search "Agent sweep is failing in:title" \
          --json number,title --jq '[.[] | select(.title == "Agent sweep is failing")][0].number // empty')
        if [ -n "$existing" ]; then
          gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
        else
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Agent sweep is failing" --body "The periodic sweep failed: $RUN_URL

        This is a note from the workflow, not the agent. While the sweep is failing, nothing is picking up stuck pull requests or unanswered issues, so the automation is quietly not working."
        fi
