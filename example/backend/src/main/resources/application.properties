quarkus.application.name=tsclientgen-example
# 8088 rather than 8080: a developer trying this out probably has something else on 8080.
quarkus.http.port=8088

# The demo page is served from src/main/resources/META-INF/resources, so the client's calls are
# same-origin and no CORS configuration is needed.
quarkus.http.enable-compression=true

# ISO-8601 on the wire, which is what the generator assumes when it spells `Instant` as `string`.
# It is the Quarkus default; set explicitly here because the generated client depends on it.
quarkus.jackson.write-dates-as-timestamps=false
