# IntelliJ inspections -- the analyser behind the warnings the IDE shows, which neither the Kotlin
# CLI compiler nor ktlint reports.
version: "1.0"
linter: jetbrains/qodana-jvm-community:2026.2

profile:
  name: qodana.recommended

bootstrap: ./gradlew classes testClasses

exclude:
  - name: All
    paths:
      - build
      - .gradle
      - annotations/build
      - generator/build
      - example/backend/build
      - example/web/node_modules
      # Generated on purpose and compared byte for byte by the drift test. Inspecting it would
      # report on the generator's output as though it were handwritten source, and the only
      # honest fix for a finding here is a change to the emitter.
      - example/web/src/generated

  # This is a library: most of its public API is unused *within* the repository and called only by
  # consumers, so UnusedSymbol reports the surface it ships on purpose. Dead private code is a
  # different question and is still caught.
  - name: UnusedSymbol

  # The chains this fires on run over a handful of endpoints or DTO members at generation time, not
  # over data at request time: a Sequence would be slower here, not faster, and reads worse. See #43.
  - name: ConvertCallChainIntoSequence

  # A real call to make, not noise the way the two above are: destructuring a small record used in
  # full (DeclaredMember's three fields, all read) is worth it, and is written by hand where it
  # applies. What this inspection cannot tell apart is Endpoint and Param, both much wider records
  # where a loop reads only some fields — there a positional tuple (skipping members with `_`, or
  # matching only a prefix) is harder to read than `param.wireName`, not easier. Per-site suppression
  # would hide that judgement in several places instead of stating it once. See #43.
  - name: DestructuringDeclaration
